# RAG pipeline settings: chunking, index, retrieval, guardrails, generation and public limits.
# Every value here was either measured on the dev split or is a stated default (see comments).

chunking:
  chunk_words: 300            # ~400 tokens for bge-small (512-token limit), under the ~512 default
  chunk_overlap_words: 40     # ~13% overlap
  min_chunk_words: 80         # smaller heading sections merge with the next one
  sheet_rows_per_chunk: 20
  sheet_overlap_rows: 2       # computed gold quotes span up to 3 rows; overlap keeps them whole

index:
  dir: data/index
  collection: chunks_v1
  models_cache_dir: data/cache/models

models:
  embed: BAAI/bge-small-en-v1.5
  sparse: Qdrant/bm25
  rerank: Xenova/ms-marco-MiniLM-L-6-v2
  guard: meta-llama/llama-prompt-guard-2-86m
  generator: qwen/qwen3.8-27b

retrieval:
  prefetch_limit: 50          # candidates per search before fusion
  rerank_candidates: 40       # only for the hybrid-rerank ablation; reranking lost on dev
  context_chunks: 6           # passages handed to the answer model

guardrails:
  guard_threshold: 0.9        # prompt-guard injection probability that blocks a question or passage
  # Cross-encoder score of the best passage below this refuses before calling the answer model.
  # Dev split: the strictest value with at most 1 in 20 answerable questions refused
  # (1/29 refused, 3/9 must-refuse questions stopped early).
  evidence_threshold: -7.0

limits:
  max_question_chars: 500
  rate_per_minute: 6
  rate_per_day: 100

# Deployed version (Vercel + Qdrant Cloud): embeddings are computed by Qdrant Cloud Inference,
# so the API runs no local model. URL and key come from QDRANT_URL / QDRANT_API_KEY.
cloud:
  collection: chunks_v2_cloud
  dense_model: sentence-transformers/all-minilm-l6-v2
  sparse_model: qdrant/bm25
  mode: hybrid
  fusion: dbsf               # re-checked on dev for the MiniLM index (Task 12)
  evidence_threshold: 0.0    # top dense cosine below this refuses; calibrated on dev (Task 12)
