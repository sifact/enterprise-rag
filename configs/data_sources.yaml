# Corpus definition for the enterprise RAG demo. The fictional "company" is GitLab.
# Every source is pinned (commit or accession number) so the corpus can be rebuilt exactly.
# Role names here are the only role names used anywhere else (ingestion metadata, auth, golden set).

seed: 42

paths:
  raw_dir: data/raw          # downloaded/generated source files + manifest.jsonl
  cache_dir: data/cache      # git checkout of the handbook

roles: [engineering, hr, marketing, legal, sales, finance, c_level]
# c_level is added to allowed_roles on every chunk at ingestion time, so it sees everything.
superuser_role: c_level

handbook:
  repo: https://gitlab.com/gitlab-com/content-sites/handbook
  commit: 322e725aa43e37884fdc7aeb27f1e822a696a656   # main @ 2026-10-22
  content_root: content/handbook
  license: CC-BY-SA-4.0          # page content; repo code is MIT
  # Pages are sampled per folder with `seed`. Stub pages (mostly links or front matter) are skipped.
  min_words: 300
  # Folder -> role. `pages` is the sample size; available = .md files in the folder(s) at the pinned commit.
  departments:
    engineering:
      folders: [engineering]                                   # 1299 available
      pages: 50
    hr:
      folders: [people-group, total-rewards, hiring, people-policies]   # 115 available
      pages: 45
    marketing:
      folders: [marketing]                                     # 366 available
      pages: 40
    legal:
      folders: [legal]                                         # 113 available
      pages: 35
    sales:
      folders: [sales]                                         # 188 available
      pages: 40
    finance:
      folders: [finance]                                       # 73 available
      pages: 30
  # Company-wide pages every role can read (allowed_roles = all roles).
  general:
    folders: [company, values, communication]                  # 256 available
    pages: 30
  # total: 270 pages

sec_filings:
  # GitLab Inc., CIK 0001653482. EDGAR serves these as inline-XBRL HTML, not PDF;
  # ingestion renders each to PDF first so the PDF/table parsing path is exercised.
  cik: 1653482
  user_agent_env: SEC_USER_AGENT   # EDGAR asks for "Name contact@email"; set it locally, never commit it
  role: finance
  filings:
    - form: 10-K
      period_end: 2026-01-31     # fiscal 2026
      filed: 2026-03-17
      accession: 0001628280-26-018731
      document: gtlb-20260131.htm
    - form: 10-Q
      period_end: 2026-07-31     # Q2 fiscal 2027
      filed: 2026-09-02
      accession: 0001628280-26-059943
      document: gtlb-20260731.htm

synthetic_xlsx:
  # Generated by our own script with `seed`; numbers are fictional and labelled as such inside each file.
  role: finance
  files:
    - name: budget_fy2027.xlsx
      contents: department budget by quarter (opex lines, plan vs actual for Q1-Q2)
    - name: headcount_fy2027.xlsx
      contents: headcount by department, region and level, with hiring plan
    - name: vendor_spend_fy2027.xlsx
      contents: top vendors by category and quarter

evaluation:
  golden_set: eval/golden/v1.jsonl   # written by us, see README "Evaluation data"
  financebench:
    enabled: false
    source: https://huggingface.co/datasets/PatronusAI/financebench
    license: CC-BY-NC-4.0
    # 150 open questions over 32 other companies (no GitLab), so it runs against its own
    # separate collection and is reported separately from the GitLab golden set.
