<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An internal company assistant that answers from company documents and only shows each team what it is allowed to read." />
    <title>Enterprise RAG: answers that respect who can see what</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint; dark is the default.
      (function () {
        var t = localStorage.getItem("theme");
        document.documentElement.classList.toggle("dark", t !== "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
