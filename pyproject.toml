[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG with RBAC, guardrails, evals and CI over a GitLab-based corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "playwright>=1.48",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
enterprise-rag = "enterprise_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
